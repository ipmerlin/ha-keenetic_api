request_api:
  fields:
    device_id:
      selector:
        device:
          integration: keenetic_api
          manufacturer: Keenetic
    entry_id:
      selector:
        config_entry:
          integration: keenetic_api
    method:
      required: true
      selector:
        select:
          options:
            - GET
            - POST
    endpoint:
      required: true
      example: "/rci/show/version"
      selector:
        template:
    data_json:
      required: false
      selector:
        template:
